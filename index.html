<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b1b">
<!-- Google Fonts: Cinzel & Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Tranceformation — Gateway</title>
<style>
:root {
  color-scheme: dark;
  --violet: #be77ff;
  --violet-glow: rgba(190, 119, 255, 0.7);
  --cyan: #57daff;
  --cyan-glow: rgba(87, 218, 255, 0.7);
  --font-game: 'Cinzel', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }

body {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  isolation: isolate;
  background: #100b1b;
  color: #fff;
  font-family: var(--font-body);
  user-select: none;
  -webkit-user-select: none;
}

/* Background Ambience */
#ambience {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%, rgba(55, 18, 92, 0.5) 0%, transparent 65%),
    radial-gradient(circle at 20% 80%, rgba(20, 80, 110, 0.25) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(110, 30, 130, 0.3) 0%, transparent 50%),
    #100b1b;
}

/* Hypnotic Spiral Canvas Layer */
#spiral-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Floating Mystical Symbols Background */
.symbols {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.symbols span {
  position: absolute;
  color: rgba(245, 231, 255, 0.75);
  font-size: clamp(20px, 3.2vw, 42px);
  text-shadow: 0 0 12px var(--violet-glow), 0 0 28px var(--cyan-glow);
  filter: drop-shadow(0 0 8px rgba(157, 78, 221, 0.5));
  animation: floatSymbol 22s ease-in-out infinite alternate;
}

.symbols span:nth-child(1){left:8%;top:18%;animation-delay:-3s}
.symbols span:nth-child(2){left:22%;top:78%;animation-delay:-12s}
.symbols span:nth-child(3){left:83%;top:16%;animation-delay:-8s}
.symbols span:nth-child(4){left:76%;top:82%;animation-delay:-18s}
.symbols span:nth-child(5){left:48%;top:10%;animation-delay:-2s}
.symbols span:nth-child(6){left:92%;top:53%;animation-delay:-10s}
.symbols span:nth-child(7){left:11%;top:54%;animation-delay:-15s}
.symbols span:nth-child(8){left:36%;top:86%;animation-delay:-6s}
.symbols span:nth-child(9){left:65%;top:22%;animation-delay:-14s}
.symbols span:nth-child(10){left:28%;top:32%;animation-delay:-9s}
.symbols span:nth-child(11){left:88%;top:72%;animation-delay:-4s}
.symbols span:nth-child(12){left:55%;top:82%;animation-delay:-11s}

/* Main Container Layout */
main {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 1200px;
  padding: 2rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: arrive 1.8s cubic-bezier(.2, .8, .2, 1) both;
}

/* Title Styling: Single Word on One Line with Cinzel */
.title-container {
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  margin: 0;
  line-height: 1;
  white-space: nowrap;
}

.title-trance, .title-formation {
  font-family: var(--font-game);
  font-size: clamp(2.5rem, 8.5vw, 7.5rem);
  font-weight: 800;
  letter-spacing: 0.02em;
}

/* "Trance": Glowing Neon Violet / Deep Purple Gradient */
.title-trance {
  background: linear-gradient(135deg, #ffffff 0%, #e6beff 35%, #ba68ff 75%, #8e2de2 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(186, 104, 255, 0.75)) drop-shadow(0 0 45px rgba(142, 45, 226, 0.4));
}

/* "formation": Luminous Cyan / Electric Ice Blue Gradient */
.title-formation {
  background: linear-gradient(135deg, #ffffff 0%, #b3f4ff 40%, #57daff 75%, #00b4db 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(87, 218, 255, 0.75)) drop-shadow(0 0 45px rgba(0, 180, 219, 0.4));
}

.title-rule {
  width: clamp(120px, 25vw, 320px);
  height: 2px;
  margin: 1.8rem auto 2.5rem;
  background: linear-gradient(90deg, transparent, var(--violet), var(--cyan), transparent);
  box-shadow: 0 0 20px var(--violet-glow);
  opacity: 0.85;
}

/* Enter The Trance Interactive Link Button */
.enter-wrapper {
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
  transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  margin-top: 1rem;
}

.enter-wrapper.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.enter-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 1rem 2.4rem;
  font-family: var(--font-game);
  font-size: clamp(1rem, 2vw, 1.4rem);
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #f1e5ff;
  text-decoration: none;
  background: rgba(22, 12, 38, 0.65);
  border: 1px solid rgba(190, 119, 255, 0.4);
  border-radius: 50px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 
    0 0 25px rgba(160, 80, 240, 0.25),
    inset 0 0 15px rgba(190, 119, 255, 0.15);
  cursor: pointer;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  animation: gentleBob 4s ease-in-out infinite alternate;
}

.enter-btn:hover {
  color: #ffffff;
  border-color: rgba(87, 218, 255, 0.8);
  background: rgba(35, 18, 62, 0.85);
  box-shadow: 
    0 0 35px rgba(87, 218, 255, 0.5),
    0 0 60px rgba(186, 104, 255, 0.4),
    inset 0 0 20px rgba(87, 218, 255, 0.3);
  transform: scale(1.06) translateY(-2px);
}

.enter-btn:active {
  transform: scale(0.98);
}

/* Circular Timer Ring */
.timer-ring {
  width: 24px;
  height: 24px;
  transform: rotate(-90deg);
}

.timer-ring circle {
  fill: none;
  stroke-width: 3;
}

.timer-ring .bg {
  stroke: rgba(255, 255, 255, 0.15);
}

.timer-ring .progress {
  stroke: var(--cyan);
  stroke-dasharray: 63; /* 2 * PI * r (r=10) */
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.1s linear;
}

/* Gateway Transition Overlay */
#warp-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: radial-gradient(circle at 50% 50%, #1a022d 0%, #000000 100%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease, transform 1.2s ease;
}

#warp-overlay.active {
  opacity: 1;
  pointer-events: all;
  transform: scale(1.1);
}

/* Keyframe Animations */
@keyframes floatSymbol {
  from { transform: translate3d(-10px, 12px, 0) rotate(-15deg); }
  to { transform: translate3d(14px, -18px, 0) rotate(20deg); }
}

@keyframes gentleBob {
  0% { transform: translateY(0); }
  100% { transform: translateY(-8px); }
}

@keyframes arrive {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 600px) {
  main { padding: 1.2rem; }
  .title-trance, .title-formation { font-size: clamp(1.8rem, 8vw, 3.2rem); }
  .title-rule { margin: 1.2rem auto 2rem; }
  .enter-btn { padding: 0.85rem 1.8rem; letter-spacing: 0.15em; }
}
</style>
</head>
<body>

<div id="ambience" aria-hidden="true"></div>
<canvas id="spiral-canvas"></canvas>

<!-- Floating Mystic Background Icons -->
<div class="symbols" aria-hidden="true">
  <span>🌀</span><span>✧</span><span>☾</span><span>◈</span>
  <span>✦</span><span>◎</span><span>🜁</span><span>⋆</span>
  <span>⏳</span><span>☽</span><span>◇</span><span>✴</span>
</div>

<!-- Main Title Content -->
<main>
  <h1 class="title-container" aria-label="Tranceformation">
    <span class="title-trance">Trance</span><span class="title-formation">formation</span>
  </h1>

  <div class="title-rule" aria-hidden="true"></div>

  <!-- Gateway Action Trigger (Appears after 2 seconds) -->
  <div class="enter-wrapper" id="enterWrapper">
    <button class="enter-btn" id="enterBtn" onclick="enterGame()">
      <span>Enter the Trance</span>
      <svg class="timer-ring" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="bg" cx="12" cy="12" r="10" />
        <circle class="progress" id="timerProgress" cx="12" cy="12" r="10" />
      </svg>
    </button>
  </div>
</main>

<!-- Smooth Page Transition Overlay -->
<div id="warp-overlay" aria-hidden="true"></div>

<script>
// --- Canvas Hypnotic Spiral Logic ---
const canvas = document.getElementById('spiral-canvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY;
let rotation = 0;
let mouseX = 0, mouseY = 0;
let targetMouseX = 0, targetMouseY = 0;

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  centerX = width / 2;
  centerY = height / 2;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

window.addEventListener('mousemove', (e) => {
  targetMouseX = (e.clientX - centerX) * 0.05;
  targetMouseY = (e.clientY - centerY) * 0.05;
});

function drawSpiral() {
  ctx.clearRect(0, 0, width, height);

  // Smooth mouse drift interpolation
  mouseX += (targetMouseX - mouseX) * 0.05;
  mouseY += (targetMouseY - mouseY) * 0.05;

  const cx = centerX + mouseX;
  const cy = centerY + mouseY;

  rotation += 0.008; // Continuous smooth rotation

  const numArms = 5;
  const maxRadius = Math.max(width, height) * 0.65;
  const loops = 7;
  const totalPoints = 350;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  for (let arm = 0; arm < numArms; arm++) {
    const armAngleOffset = (arm * 2 * Math.PI) / numArms;

    // Glowing Inner Spiral Path
    ctx.beginPath();
    for (let i = 0; i < totalPoints; i++) {
      const progress = i / totalPoints;
      const angle = progress * loops * Math.PI * 2 + rotation + armAngleOffset;
      const radius = Math.pow(progress, 1.3) * maxRadius;

      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }

    // Dynamic Gradient Stroke
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxRadius);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    grad.addColorStop(0.25, 'rgba(190, 119, 255, 0.7)');
    grad.addColorStop(0.65, 'rgba(87, 218, 255, 0.4)');
    grad.addColorStop(1, 'rgba(16, 11, 27, 0)');

    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.5 + Math.sin(rotation * 2 + arm) * 1;
    ctx.stroke();
  }

  // Central Core Glow Pulsing Ring
  const pulse = Math.sin(rotation * 3) * 15 + 65;
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse * 2.5);
  coreGrad.addColorStop(0, 'rgba(215, 160, 255, 0.6)');
  coreGrad.addColorStop(0.4, 'rgba(87, 218, 255, 0.25)');
  coreGrad.addColorStop(1, 'rgba(16, 11, 27, 0)');

  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, pulse * 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  requestAnimationFrame(drawSpiral);
}

requestAnimationFrame(drawSpiral);

// --- Gateway Entrance & Timer Logic ---
const TOTAL_AUTO_TIME = 10; // Total seconds before auto-redirect
const APPEAR_DELAY = 2; // Seconds before "Enter the Trance" appears
let elapsed = 0;
let isEntering = false;

const enterWrapper = document.getElementById('enterWrapper');
const timerProgress = document.getElementById('timerProgress');
const warpOverlay = document.getElementById('warp-overlay');

// Reveal "Enter the Trance" button after 2 seconds
setTimeout(() => {
  enterWrapper.classList.add('visible');
}, APPEAR_DELAY * 1000);

// Timer Tick Interval (Runs every 100ms)
const timerInterval = setInterval(() => {
  if (isEntering) return;
  
  elapsed += 0.1;
  const progressPercent = Math.min(1, elapsed / TOTAL_AUTO_TIME);
  
  // Update SVG timer ring offset (Circumference ~ 63)
  const offset = 63 * progressPercent;
  timerProgress.style.strokeDashoffset = offset;

  // Auto transition after 10 seconds
  if (elapsed >= TOTAL_AUTO_TIME) {
    clearInterval(timerInterval);
    enterGame();
  }
}, 100);

// Transition into Main Game
function enterGame() {
  if (isEntering) return;
  isEntering = true;
  clearInterval(timerInterval);

  // Trigger Warp Portal Transition
  warpOverlay.classList.add('active');

  setTimeout(() => {
    // Navigate to game file (replace 'main.html' with your main game file or handler)
    window.location.href = 'hypbattle.html';
  }, 1100);
}
</script>
</body>
</html>
